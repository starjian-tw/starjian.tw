<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" width="800" height="780" role="img" aria-label="未時的十二宮示意圖。命宮在卯，太陽、天梁（本年化祿）、文昌都坐命宮，祿存在亥，是命宮的三合宮；四項都在命宮的三方四正，陽梁昌祿成立。合成命例，不對應任何當事人。">
