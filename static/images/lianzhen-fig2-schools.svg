<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="同一個廉貞帶祿的財帛宮：不納入自化時仍須合看三方四正、廟陷與煞曜；納入本文採用的自化規則時，多看宮干引動廉貞化忌。祿與忌標記並存，不代表一定漏財。">
  <style>
    text { font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif; }
    .t1 { font-size: 24px; font-weight: 700; }
    .t2 { font-size: 17px; }
    .t3 { font-size: 16px; }
    .cap { font-size: 15px; fill: #6b6b6b; }
    .tag { font-size: 15px; fill: #1f4a3f; font-weight: 700; }
  </style>
  <rect x="0" y="0" width="800" height="460" fill="#ffffff"/>

  <!-- 中央：同一個宮位 -->
  <rect x="320" y="40" width="160" height="86" rx="12" fill="#1f4a3f" stroke="#163830" stroke-width="3"/>
  <text class="t1" x="400" y="76" text-anchor="middle" fill="#f5efe3">財帛宮</text>
  <text class="t2" x="400" y="106" text-anchor="middle" fill="#c9a961">廉貞．化祿</text>
  <text class="t3" x="400" y="24" text-anchor="middle" fill="#6b6b6b">同一個宮位</text>

  <!-- 分岔線 -->
  <path d="M 400 126 L 400 150 M 400 150 L 200 150 L 200 182 M 400 150 L 600 150 L 600 182"
        fill="none" stroke="#c9a961" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 左：三合派 -->
  <rect x="60" y="182" width="280" height="150" rx="12" fill="#f5efe3" stroke="#c9a961" stroke-width="2"/>
  <text class="t1" x="200" y="216" text-anchor="middle" fill="#1f4a3f">不納入自化</text>
  <text class="t2" x="200" y="250" text-anchor="middle" fill="#4a4a4a">以三合架構看「廉貞帶祿」</text>
  <text class="t2" x="200" y="280" text-anchor="middle" fill="#4a4a4a">仍須合看三方四正</text>
  <text class="t2" x="200" y="312" text-anchor="middle" fill="#1f4a3f">以及廟陷、煞曜等條件</text>

  <!-- 右：飛星派 -->
  <rect x="460" y="182" width="280" height="150" rx="12" fill="#1f4a3f" stroke="#163830" stroke-width="2"/>
  <text class="t1" x="600" y="216" text-anchor="middle" fill="#f5efe3">納入自化</text>
  <text class="t2" x="600" y="250" text-anchor="middle" fill="#f5efe3">多看一層：宮干</text>
  <text class="t2" x="600" y="280" text-anchor="middle" fill="#f5efe3">使宮內廉貞再帶化忌</text>
  <text class="t2" x="600" y="312" text-anchor="middle" fill="#c9a961">祿與忌並存，祿沒有消失</text>

  <!-- 底部對照 -->
  <text class="tag" x="400" y="374" text-anchor="middle">採用的資訊不同，不等於能單靠這一格斷定「一定留財」或「一定漏財」。</text>
  <text class="cap" x="400" y="416" text-anchor="middle">圖 2｜本文採用方法的比較，不代表流派的完整定義。</text>
  <text class="cap" x="400" y="440" text-anchor="middle">《全書》的「祿逢沖破」並未直接點名本案的宮干自化忌。</text>
</svg>
